<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirm your event — Together, Out Loud</title>
  <meta name="description" content="Confirm or decline your event booking with Together, Out Loud." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Event confirmation — Together, Out Loud" />
  <meta property="og:description" content="Confirm or decline your event booking with Together, Out Loud." />
  <meta property="og:image" content="https://www.togetheroutloud.in/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Event confirmation — Together, Out Loud" />
  <meta name="twitter:image" content="https://www.togetheroutloud.in/og-image.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin:0;
      background:#FEF6ED;
      font-family:'Inter',sans-serif;
      color:#2B2420;
      display:flex;
      justify-content:center;
      padding:36px 16px 60px;
      min-height:100vh;
    }
    .wrap { max-width:440px; width:100%; }
    .tagline {
      font-family:'Space Grotesk',sans-serif;
      font-weight:700;
      letter-spacing:-0.01em;
      font-size:24px;
      color:#C7401E;
      text-align:center;
      margin:0 0 4px;
    }
    .subhead { text-align:center; font-family:'JetBrains Mono',monospace; font-size:11.5px; text-transform:uppercase; letter-spacing:0.04em; color:#8A6A54; margin-bottom:22px; }
    .card {
      background:#FFFDF8;
      border-radius:16px;
      padding:26px 24px;
      box-shadow:0 4px 18px rgba(43,36,32,0.07);
      border:1px solid #EAD9BE;
    }
    .greet { font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:700; margin-bottom:2px; }
    .status-pill {
      display:inline-block; font-size:12.5px; font-weight:700; border-radius:20px;
      padding:4px 12px; margin-top:6px;
    }
    .status-pending { background:#FBEFD9; color:#B6752C; }
    .status-accepted { background:#E4F1F1; color:#1C7A80; }
    .status-declined { background:#F7E4DF; color:#A6432B; }
    .detail-row { display:flex; gap:10px; padding:10px 0; border-bottom:1px solid #EAD9BE; font-size:14.5px; }
    .detail-row:last-of-type { border-bottom:none; }
    .detail-icon { flex-shrink:0; width:20px; text-align:center; }
    .detail-label { color:#8A6A54; font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.03em; }
    .detail-value { font-weight:600; }
    .btn-row { display:flex; gap:10px; margin-top:22px; }
    button {
      flex:1; padding:13px; border-radius:10px; border:none; font-size:15px; font-weight:700;
      font-family:'Inter',sans-serif; cursor:pointer; transition:opacity 0.15s;
    }
    button:disabled { opacity:0.5; cursor:default; }
    .btn-accept { background:#1C7A80; color:#FFFFFF; }
    .btn-decline { background:#FFFFFF; color:#A6432B; border:1.5px solid #EAD9BE; }
    .msg { text-align:center; font-size:14.5px; margin-top:18px; color:#2B2420; }
    .loading, .error { text-align:center; padding:40px 0; color:#8A6A54; }
    .note-label { font-size:11px; font-family:'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:0.03em; color:#8A6A54; margin-top:20px; margin-bottom:6px; display:block; }
    textarea {
      width:100%; padding:11px 12px; border:1.5px solid #EAD9BE; border-radius:9px;
      font-size:14px; font-family:'Inter',sans-serif; color:#2B2420; background:#FFFDFA;
      resize:vertical; min-height:64px;
    }
    textarea:focus { outline:none; border-color:#C7401E; }
    .btn-save-note { width:100%; margin-top:8px; background:#F0DCC8; color:#2B2420; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="tagline">Together, Out Loud</div>
    <div class="subhead">Event confirmation</div>
    <div class="card" id="card">
      <div class="loading">Loading…</div>
    </div>
  </div>
  <script>
    const token = new URLSearchParams(window.location.search).get("token");
    const card = document.getElementById("card");
    const statusLabel = { pending: "Awaiting your response", accepted: "You've accepted", declined: "You've declined" };
    const statusClass = { pending: "status-pending", accepted: "status-accepted", declined: "status-declined" };

    function fmtDate(d) {
      if (!d) return null;
      const parsed = new Date(d);
      if (isNaN(parsed)) return d;
      return parsed.toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
    }

    function render(data) {
      const rows = [
        ["🎤", "Experience", data.experience],
        ["📅", "Date", fmtDate(data.date)],
        ["📍", "City", data.city],
        ["🏛️", "Venue", data.venue],
        ["🕒", "Event time", data.eventTime],
        ["🎶", "Sound check", data.soundcheckTime],
        ["🎸", "Band size", data.pcs ? `${data.pcs} pcs` : null],
      ].filter(([, , v]) => v);

      const escapeHtml = (s) => (s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

      card.innerHTML = `
        <div class="greet">Hi ${data.teamName || "there"} 👋</div>
        <div>You've been booked for:</div>
        <div class="status-pill ${statusClass[data.status] || "status-pending"}">${statusLabel[data.status] || data.status}</div>
        <div style="margin-top:16px;">
          ${rows.map(([icon, label, value]) => `
            <div class="detail-row">
              <div class="detail-icon">${icon}</div>
              <div>
                <div class="detail-label">${label}</div>
                <div class="detail-value">${value}</div>
              </div>
            </div>
          `).join("")}
        </div>
        <div class="btn-row">
          <button class="btn-accept" id="acceptBtn" ${data.status === "accepted" ? "disabled" : ""}>✓ Accept</button>
          <button class="btn-decline" id="declineBtn" ${data.status === "declined" ? "disabled" : ""}>✕ Decline</button>
        </div>
        <label class="note-label" for="noteInput">Note for the organizer (optional)</label>
        <textarea id="noteInput" placeholder="e.g. running a bit late, can arrive by 6pm">${escapeHtml(data.note)}</textarea>
        <button class="btn-save-note" id="saveNoteBtn">Save note</button>
        <div class="msg" id="msg"></div>
      `;

      async function respond(status) {
        document.getElementById("acceptBtn").disabled = true;
        document.getElementById("declineBtn").disabled = true;
        document.getElementById("msg").textContent = "Saving…";
        const note = document.getElementById("noteInput").value.trim();
        try {
          const res = await fetch(`/api/public/assignment/${encodeURIComponent(token)}/respond`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status, note }),
          });
          if (!res.ok) throw new Error((await res.json()).error || "Something went wrong");
          data.status = status;
          data.note = note;
          render(data);
          document.getElementById("msg").textContent = status === "accepted" ? "Thanks — see you there! 🎉" : "Got it — thanks for letting us know.";
        } catch (err) {
          document.getElementById("msg").textContent = err.message;
          document.getElementById("acceptBtn").disabled = data.status === "accepted";
          document.getElementById("declineBtn").disabled = data.status === "declined";
        }
      }
      async function saveNote() {
        const btn = document.getElementById("saveNoteBtn");
        const note = document.getElementById("noteInput").value.trim();
        btn.disabled = true;
        document.getElementById("msg").textContent = "Saving note…";
        try {
          const res = await fetch(`/api/public/assignment/${encodeURIComponent(token)}/note`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ note }),
          });
          if (!res.ok) throw new Error((await res.json()).error || "Something went wrong");
          data.note = note;
          document.getElementById("msg").textContent = "Note saved.";
        } catch (err) {
          document.getElementById("msg").textContent = err.message;
        } finally {
          btn.disabled = false;
        }
      }
      document.getElementById("acceptBtn").addEventListener("click", () => respond("accepted"));
      document.getElementById("declineBtn").addEventListener("click", () => respond("declined"));
      document.getElementById("saveNoteBtn").addEventListener("click", saveNote);
    }

    if (!token) {
      card.innerHTML = `<div class="error">This link is missing its token — ask whoever sent it for a fresh copy.</div>`;
    } else {
      fetch(`/api/public/assignment/${encodeURIComponent(token)}`)
        .then(async (res) => {
          if (!res.ok) throw new Error((await res.json()).error || "Couldn't load this link");
          return res.json();
        })
        .then(render)
        .catch((err) => {
          card.innerHTML = `<div class="error">${err.message}</div>`;
        });
    }
  </script>
</body>
</html>
