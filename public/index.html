<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#C1602B" />
  <link rel="icon" href="/logo.png" />
  <title>Together Out Loud — Workflow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="tol-app">
    <div class="mobile-topbar">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">☰</button>
      <img src="/logo.png" class="brand-mark" alt="Together, Out Loud" />
      <div class="brand-name">Together Out Loud</div>
      <button class="mobile-logout-btn" id="mobileLogoutBtn" aria-label="Log out">⏻</button>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="/logo.png" class="brand-mark" alt="Together, Out Loud" />
        <div>
          <div class="brand-name">Together Out Loud</div>
          <div class="brand-tag" id="brandTag">Lead-to-booking workflow</div>
        </div>
      </div>
      <div class="global-search-wrap">
        <input id="globalSearchInput" class="global-search-input" placeholder="Search leads, team…" autocomplete="off" />
        <div id="globalSearchResults" class="global-search-results"></div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot muted" id="sidebarFoot">Loading…</div>
    </aside>
    <main class="main" id="main">
      <p class="muted">Loading workflow…</p>
    </main>
  </div>

  <div id="modalRoot"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
