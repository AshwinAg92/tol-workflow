<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>How did it feel? — Together, Out Loud</title>
  <meta name="description" content="Tell us how your event with Together, Out Loud felt. It takes 30 seconds." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Thank you — Together, Out Loud" />
  <meta property="og:description" content="How did it feel? Tap a face — it takes 30 seconds." />
  <meta property="og:image" content="https://www.togetheroutloud.in/thank-you-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Thank you — Together, Out Loud" />
  <meta name="twitter:image" content="https://www.togetheroutloud.in/thank-you-image.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin:0;
      background:#FEF6ED;
      font-family:'Inter',sans-serif;
      color:#2B2420;
      display:flex;
      justify-content:center;
      padding:28px 16px 60px;
      min-height:100vh;
    }
    .wrap { max-width:440px; width:100%; }
    .tagline { font-family:'Space Grotesk',sans-serif; font-weight:700; letter-spacing:-0.01em; font-size:22px; color:#C7401E; text-align:center; margin:0 0 18px; }
    .card { background:#FFFDF8; border-radius:18px; padding:26px 22px; box-shadow:0 4px 18px rgba(43,36,32,0.07); border:1px solid #EAD9BE; }
    .hero { width:120px; height:120px; border-radius:50%; object-fit:cover; display:block; margin:-4px auto 14px; border:3px solid #F6E3C8; }
    .greet { font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; text-align:center; margin-bottom:4px; }
    .event-sub { color:#8A6A54; font-size:14px; text-align:center; margin-bottom:6px; }
    .ask { text-align:center; font-size:16px; margin:16px 0 4px; }
    .faces { display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; margin:12px 0 4px; }
    .face {
      background:#FFF; border:1.5px solid #EAD9BE; border-radius:14px; padding:10px 0 8px; cursor:pointer;
      display:flex; flex-direction:column; align-items:center; gap:4px; font-family:inherit; color:#8A6A54;
      transition:transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }
    .face .emoji { font-size:30px; line-height:1; filter:grayscale(0.4); transition:filter 0.12s ease; }
    .face .word { font-size:11px; }
    .face:hover { transform:translateY(-2px); }
    .face.picked { border-color:#C7401E; background:#FDEFE6; color:#C7401E; }
    .face.picked .emoji { filter:none; transform:scale(1.12); }
    .more { margin-top:18px; }
    .more[hidden] { display:none; }
    .note-label { font-size:13px; font-weight:600; margin-bottom:6px; display:block; }
    textarea {
      width:100%; padding:11px 12px; border:1.5px solid #EAD9BE; border-radius:10px;
      font-size:16px; font-family:'Inter',sans-serif; color:#2B2420; background:#FFFDFA; resize:vertical; min-height:84px;
    }
    textarea:focus { outline:none; border-color:#C7401E; }
    .share { display:flex; gap:10px; align-items:flex-start; margin-top:12px; font-size:14px; color:#4A3E36; cursor:pointer; }
    .share input { width:20px; height:20px; margin:1px 0 0; accent-color:#C7401E; flex-shrink:0; }
    button.submit {
      width:100%; margin-top:16px; padding:14px; border-radius:12px; border:none;
      background:#C7401E; color:#FFFFFF; font-size:16px; font-weight:700; font-family:'Inter',sans-serif; cursor:pointer;
    }
    button.submit:disabled { opacity:0.5; cursor:default; }
    .saved { text-align:center; font-size:13px; color:#1C7A80; margin-top:8px; min-height:18px; }
    .msg { text-align:center; font-size:14px; margin-top:12px; color:#A6432B; min-height:18px; }
    .loading, .error { text-align:center; padding:40px 0; color:#8A6A54; }
    .thanks { text-align:center; }
    .thanks .big { font-size:44px; margin-bottom:8px; }
    .thanks p { color:#4A3E36; font-size:15px; line-height:1.5; }
    .link-btn { display:block; margin:12px auto 0; padding:12px 16px; border-radius:12px; text-decoration:none; font-weight:600; font-size:15px; max-width:320px; }
    .link-btn.google { background:#1C7A80; color:#FFF; }
    .link-btn.insta { border:1.5px solid #EAD9BE; color:#2B2420; background:#FFF; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="tagline">Together, Out Loud</div>
    <div class="card" id="card">
      <div class="loading">Loading…</div>
    </div>
  </div>
  <script>
    const token = new URLSearchParams(window.location.search).get("token");
    const card = document.getElementById("card");
    const FACES = [
      { n: 1, emoji: "😞", word: "Poor" },
      { n: 2, emoji: "😐", word: "Okay" },
      { n: 3, emoji: "🙂", word: "Good" },
      { n: 4, emoji: "😊", word: "Great" },
      { n: 5, emoji: "😍", word: "Loved it" },
    ];
    let rating = 0;
    const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmtDate = (d) => {
      if (!d) return "";
      const parsed = new Date(d + "T00:00:00");
      return isNaN(parsed) ? d : parsed.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
    };
    const send = async (body) => {
      const res = await fetch(`/api/public/feedback/${encodeURIComponent(token)}`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "Something went wrong — please try again.");
    };

    function thanks(data) {
      card.innerHTML = `
        <div class="thanks">
          <div class="big">💛</div>
          <div class="greet">Thank you, ${esc(data.firstName)}!</div>
          <p>It means a lot to all of us. We hope to sing with you again soon.</p>
          ${data.googleReviewLink ? `<p>If you have one more minute, a Google review helps other families find us.</p><a class="link-btn google" href="${esc(data.googleReviewLink)}" target="_blank" rel="noopener">Write a Google review</a>` : ""}
          <a class="link-btn insta" href="https://instagram.com/togetheroutloudclub" target="_blank" rel="noopener">📷 Follow us on Instagram</a>
        </div>`;
    }

    function render(data) {
      const sub = [data.occasion ? `Your ${data.occasion}` : "", fmtDate(data.date), data.city].filter(Boolean).join(" · ");
      card.innerHTML = `
        <img class="hero" src="/logo-icon.png" alt="" />
        <div class="greet">Hi ${esc(data.firstName)} 👋</div>
        ${sub ? `<div class="event-sub">${esc(sub)}</div>` : ""}
        <div class="ask">How did it feel?</div>
        <div class="faces" role="radiogroup" aria-label="Your rating">
          ${FACES.map((f) => `<button type="button" class="face" role="radio" aria-checked="false" data-n="${f.n}"><span class="emoji" aria-hidden="true">${f.emoji}</span><span class="word">${f.word}</span></button>`).join("")}
        </div>
        <div class="saved" id="saved"></div>
        <div class="more" id="more" hidden>
          <label class="note-label" for="note">Anything you'd like to tell us? (optional)</label>
          <textarea id="note" maxlength="2000" placeholder="A moment you loved, or something we could do better">${esc(data.message || "")}</textarea>
          <label class="share"><input type="checkbox" id="shareOk" ${data.shareOk ? "checked" : ""} /> <span>Happy for us to share your words on our website (we never use your name)</span></label>
          <button class="submit" id="submitBtn">Send</button>
        </div>
        <div class="msg" id="msg"></div>`;
      const pick = (n) => {
        rating = n;
        card.querySelectorAll(".face").forEach((b) => {
          const on = Number(b.dataset.n) === n;
          b.classList.toggle("picked", on);
          b.setAttribute("aria-checked", on ? "true" : "false");
        });
        document.getElementById("more").hidden = false;
      };
      if (data.rating) pick(data.rating);
      // The tap itself is saved straight away, so a one-tap answer still reaches us.
      card.querySelectorAll(".face").forEach((b) => b.addEventListener("click", async () => {
        pick(Number(b.dataset.n));
        const saved = document.getElementById("saved");
        saved.textContent = "";
        try { await send({ rating }); saved.textContent = "Saved — thank you! Add a note below if you like."; }
        catch (err) { document.getElementById("msg").textContent = err.message; }
      }));
      document.getElementById("submitBtn").addEventListener("click", async () => {
        const msg = document.getElementById("msg");
        if (!rating) { msg.textContent = "Please tap one of the faces first."; return; }
        const btn = document.getElementById("submitBtn");
        btn.disabled = true;
        msg.textContent = "";
        try {
          await send({ rating, message: document.getElementById("note").value.trim(), shareOk: document.getElementById("shareOk").checked });
          thanks(data);
        } catch (err) {
          msg.textContent = err.message;
          btn.disabled = false;
        }
      });
    }

    if (!token) {
      card.innerHTML = `<div class="error">This link is missing a part — please ask us for a fresh one.</div>`;
    } else {
      fetch(`/api/public/feedback/${encodeURIComponent(token)}`)
        .then(async (res) => {
          if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "Couldn't load this link");
          return res.json();
        })
        .then(render)
        .catch((err) => { card.innerHTML = `<div class="error">${esc(err.message)}</div>`; });
    }
  </script>
</body>
</html>
