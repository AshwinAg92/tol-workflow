<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My events — Together, Out Loud</title>
  <meta name="description" content="Your upcoming events with Together, Out Loud." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="My events — Together, Out Loud" />
  <meta property="og:description" content="Your upcoming events with Together, Out Loud." />
  <meta property="og:image" content="https://www.togetheroutloud.in/og-image.png?v=2" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="My events — Together, Out Loud" />
  <meta name="twitter:image" content="https://www.togetheroutloud.in/og-image.png?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; background:#FEF6ED; font-family:'Inter',sans-serif; color:#2B2420; display:flex; justify-content:center; padding:28px 14px 60px; min-height:100vh; }
    .wrap { max-width:520px; width:100%; }
    .tagline { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; color:#C7401E; text-align:center; margin:0 0 2px; }
    .subhead { text-align:center; font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:#8A6A54; margin-bottom:16px; }
    .hello { font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; margin:0 0 12px; }
    .tabs { display:flex; gap:8px; margin-bottom:14px; }
    .tab { flex:1; padding:10px; border-radius:10px; border:1.5px solid #EAD9BE; background:#fff; font-weight:700; font-size:14px; color:#8A6A54; cursor:pointer; font-family:inherit; }
    .tab.on { background:#C7401E; color:#fff; border-color:#C7401E; }
    .card { background:#FFFDF8; border-radius:16px; padding:18px 18px 16px; box-shadow:0 4px 18px rgba(43,36,32,.07); border:1px solid #EAD9BE; margin-bottom:14px; }
    .when { font-family:'JetBrains Mono',monospace; font-size:12px; color:#8A6A54; text-transform:uppercase; letter-spacing:.03em; }
    .title { font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:700; margin:2px 0 4px; }
    .pill { display:inline-block; font-size:12px; font-weight:700; border-radius:20px; padding:3px 11px; margin:4px 6px 4px 0; }
    .p-pending { background:#FBEFD9; color:#B6752C; } .p-accepted { background:#E4F1F1; color:#1C7A80; } .p-declined { background:#F7E4DF; color:#A6432B; } .p-paid { background:#E3F4E5; color:#1E6B2B; } .p-tent { background:#EEE6F5; color:#6B4A8A; }
    .row { display:flex; gap:9px; padding:6px 0; font-size:14px; } .row .ic { width:20px; text-align:center; flex-shrink:0; } .lbl { color:#8A6A54; font-size:12px; }
    .sec { font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:#8A6A54; margin:12px 0 4px; }
    .leg { border-top:1px solid #EAD9BE; padding:8px 0; font-size:14px; }
    .leg a { color:#1C7A80; font-weight:600; }
    .btns { display:flex; gap:10px; margin-top:12px; }
    button.act { flex:1; padding:12px; border-radius:10px; border:none; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; }
    button.act:disabled { opacity:.5; }
    .b-acc { background:#1C7A80; color:#fff; } .b-dec { background:#fff; color:#A6432B; border:1.5px solid #EAD9BE; }
    textarea { width:100%; padding:10px; border:1.5px solid #EAD9BE; border-radius:9px; font-size:14px; font-family:inherit; background:#FFFDFA; min-height:56px; margin-top:6px; }
    .save { width:100%; margin-top:6px; padding:10px; border-radius:9px; border:none; background:#F0DCC8; font-weight:700; font-family:inherit; cursor:pointer; }
    .msg { font-size:13px; color:#2B2420; margin-top:6px; min-height:16px; }
    .muted { color:#8A6A54; font-size:13px; } .error, .loading { text-align:center; padding:40px 0; color:#8A6A54; }
    .claim { border-top:1px solid #EAD9BE; padding:8px 0; font-size:14px; display:flex; justify-content:space-between; gap:10px; }
    .claim-form { margin-top:8px; padding:12px; border:1.5px dashed #EAD9BE; border-radius:12px; background:#FFFDFA; }
    .claim-form input[type=text], .claim-form input[type=number] { width:100%; padding:11px; border:1.5px solid #EAD9BE; border-radius:9px; font-size:16px; font-family:inherit; background:#fff; margin-top:6px; }
    .claim-form .file { display:block; margin-top:8px; padding:12px; border:1.5px solid #EAD9BE; border-radius:9px; background:#fff; text-align:center; font-weight:700; color:#1C7A80; cursor:pointer; }
    .claim-form .file input { display:none; }
    .b-claim { background:#C7401E; color:#fff; }
    .ci { margin-top: 6px; padding: 7px 10px; border-radius: 8px; background: #F4F0E8; font-size: 13px; }
    .ci.due { background: #F3ECF7; border: 1px solid #6B4488; } .ci.ok { background: #E8F3F1; color: #1C7A80; }
    .ci.warn { background: #FBF1E4; color: #8A5A1F; } .ci.bad { background: #FBEAE6; color: #A6432B; }
  .rrow { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; border-radius: 6px; }
    .rrow.miss { background: #FBEAE6; }
    .rstar { background: none; border: none; font-size: 28px; color: #D9D2C3; padding: 2px 3px; cursor: pointer; }
    .rstar.on { color: #E0A21B; }
    .rnote { width: 100%; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="tagline">Together, Out Loud</div>
    <div class="subhead">My events</div>
    <div id="app"><div class="loading">Loading…</div></div>
  </div>
  <script>
    const token = location.pathname.split("/").filter(Boolean)[1] || "";
    const app = document.getElementById("app");
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmtDate = (d) => { if (!d) return ""; const x = new Date(String(d).slice(0, 10) + "T00:00:00"); return isNaN(x) ? d : x.toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short", year: "numeric" }); };
    const fmt12 = (t) => { if (!t) return ""; const m = /^(\d{1,2}):(\d{2})$/.exec(t); if (!m) return t; const h = +m[1]; return ((h % 12) || 12) + ":" + m[2] + " " + (h >= 12 ? "PM" : "AM"); };
    const TYPE = { going: "➡ Going", return: "⬅ Return", going_onward: "🔗 Going & Onward", return_onward: "🔗 Return & Onward", onward: "🔗 Onward" };
    const MODE = { flight: "Flight", train: "Train", bus: "Bus", car: "Car", cab: "Cab" };
    const ST = { booked: "Booked", not_booked: "Not booked yet" };
    let data = null, tab = "upcoming", openClaim = null;
    const inr = (n) => "₹" + Number(n || 0).toLocaleString("en-IN");
    // Check-in times come as ISO; show them in IST, with the date when it isn't today.
    const istWhen = (iso) => { const t = new Date(Date.parse(iso) + 5.5 * 3600e3).toISOString(); const today = new Date(Date.now() + 5.5 * 3600e3).toISOString().slice(0, 10); return fmt12(t.slice(11, 16)) + (t.slice(0, 10) === today ? "" : ", " + fmtDate(t.slice(0, 10))); };
    function checkinHtml(l) {
      const c = l.checkin; if (!c) return "";
      const pen = l.penalty;
      const penLine = !pen ? "" : pen.status === "applied" ? "<div>Travel reimbursement for this trip is withheld.</div>" : pen.status === "waived" ? "<div>Penalty waived by Team TOL.</div>" : "<div>Team TOL will review this.</div>";
      const btn = (t) => `<button class="save" data-ci="${esc(l.id)}" style="background:#6B4488; color:#fff;">${t}</button>`;
      if (c.state === "done") return `<div class="ci ok">✓ Checked in at ${esc(istWhen(c.at))}</div>`;
      if (c.state === "late") return `<div class="ci warn">Checked in late at ${esc(istWhen(c.at))} (due by ${esc(istWhen(c.dueAt))})${penLine}</div>`;
      if (c.state === "missed") return `<div class="ci bad">✗ Check-in missed (due by ${esc(istWhen(c.dueAt))})${penLine}</div>`;
      if (c.state === "upcoming") return `<div class="ci">📸 Check in at the station/airport by <b>${esc(istWhen(c.dueAt))}</b> — 1 hour before departure. Opens at ${esc(istWhen(c.opensAt))}.</div>`;
      if (c.state === "open") return `<div class="ci due">📸 <b>Check in now</b> — a photo of yourself at the station/airport by <b>${esc(istWhen(c.dueAt))}</b>.${btn("📸 Check in")}</div>`;
      return `<div class="ci bad">⚠️ <b>Check-in overdue</b> — it was due by ${esc(istWhen(c.dueAt))}. Upload now.${btn("📸 Check in now")}</div>`;
    }
    // ---- Team ratings: locks this page until done (the next event stays visible below) ----
    const RK = [["performance", "Performance"], ["punctuality", "Punctuality"], ["attitude", "Attitude"]];
    const starsRo = (v) => `<span style="color:#E0A21B;">${"★".repeat(Math.round(v))}</span><span style="color:#D9D2C3;">${"★".repeat(5 - Math.round(v))}</span> ${Number(v).toFixed(1)}`;
    function ratingLockHtml() {
      const ev = data.ratingsDue[0];
      const nextI = data.upcoming.findIndex((e) => e.status === "accepted");
      return `<div class="card" style="border:2px solid #C7401E;"><div class="title" style="font-size:18px;">⭐ Rate your team</div>
        <div class="muted">${esc(ev.place)} · ${esc(fmtDate(ev.date))}. Three quick stars for each person. It's anonymous — no one sees who gave which stars. Your page opens again once you're done${data.ratingsDue.length > 1 ? ` (${data.ratingsDue.length} events to rate)` : ""}.</div></div>
        ${ev.people.map((p) => `<div class="card" data-rp="${esc(p.teamId)}"><div class="title" style="font-size:16px;">${esc(p.name)} <span class="muted" style="font-weight:400;">${esc(p.role)}</span></div>
          ${RK.map(([k, label]) => `<div class="rrow" data-k="${k}"><span>${label}</span><span>${[1, 2, 3, 4, 5].map((n) => `<button type="button" class="rstar" data-n="${n}">★</button>`).join("")}</span></div>`).join("")}
          <textarea class="rnote" maxlength="500" placeholder="Anything to add? (optional)"></textarea></div>`).join("")}
        <button class="save" id="rSend" style="background:#C7401E; color:#fff; width:100%; padding:12px;">Send ratings</button><div class="msg" id="rMsg"></div>
        ${nextI >= 0 ? `<div class="sec" style="margin:18px 4px 6px;">Your next event</div>${eventCard(data.upcoming[nextI], nextI)}` : ""}`;
    }
    function wireRatingLock() {
      app.querySelectorAll(".rrow").forEach((row) => row.querySelectorAll(".rstar").forEach((b) => b.addEventListener("click", () => {
        row.dataset.v = b.dataset.n; row.classList.remove("miss");
        row.querySelectorAll(".rstar").forEach((x) => x.classList.toggle("on", +x.dataset.n <= +b.dataset.n));
      })));
      app.querySelector("#rSend").addEventListener("click", async (evt) => {
        let ok = true;
        const ratings = [...app.querySelectorAll("[data-rp]")].map((c) => {
          const r = { teamId: c.dataset.rp, note: c.querySelector(".rnote").value.trim() };
          c.querySelectorAll(".rrow").forEach((row) => { if (!row.dataset.v) { ok = false; row.classList.add("miss"); } r[row.dataset.k] = +(row.dataset.v || 0); });
          return r;
        });
        if (!ok) { app.querySelector("#rMsg").textContent = "Give every person stars for all three."; return; }
        evt.currentTarget.disabled = true;
        try { await call(`/api/public/me/${encodeURIComponent(token)}/ratings`, { leadId: data.ratingsDue[0].leadId, ratings }); window.scrollTo(0, 0); await reload(); }
        catch (err) { app.querySelector("#rMsg").textContent = err.message; evt.currentTarget.disabled = false; }
      });
    }
    async function reload() {
      const r = await fetch(`/api/public/me/${encodeURIComponent(token)}`);
      const j = await r.json();
      if (r.ok) { data = j; render(); }
    }
    function checkinUpload(legId) {
      const input = document.createElement("input");
      input.type = "file"; input.accept = "image/*"; input.setAttribute("capture", "user");
      input.addEventListener("change", async () => {
        const file = input.files[0]; if (!file) return;
        const fd = new FormData(); fd.append("photo", file);
        try {
          const r = await fetch(`/api/public/me/${encodeURIComponent(token)}/checkins/${encodeURIComponent(legId)}`, { method: "POST", body: fd });
          const j = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(j.error || "Couldn't upload the photo");
          alert(j.late ? "Checked in — but it was after the 1-hour mark, so Team TOL will review it." : "✓ Checked in. Have a safe journey!");
          reload();
        } catch (err) { alert(err.message); }
      });
      input.click();
    }

    function eventCard(e, i) {
      const rows = [ ["🕒", e.eventTime ? "Event time: " + e.eventTime : ""], ["🎶", e.soundcheckTime ? "Sound check: " + e.soundcheckTime : ""], ["🎸", e.pcs ? e.pcs + " pcs" : ""], ["🥁", e.drumNote || ""]].filter((r) => r[1]);
      const pill = { pending: ["p-pending", "Awaiting your response"], accepted: ["p-accepted", "You've accepted"], declined: ["p-declined", "You've declined"], cancel_requested: ["p-pending", "Cancellation requested"] }[e.status] || ["p-pending", e.status];
      const legsSorted = e.travel; // already in trip order from the server
      const travel = legsSorted.length ? legsSorted.map((l, li) => {
        const inTrip = l.groupId ? legsSorted.filter((x) => x.groupId === l.groupId) : [];
        const pos = l.groupId ? inTrip.indexOf(l) + 1 : 0;
        const head = l.groupId && pos === 1 ? `<div class="sec" style="margin-top:14px;">One trip · ${inTrip.filter((x) => x.mode !== "stay").length} legs · ${esc(inTrip.filter((x) => x.mode !== "stay").map((x, i) => (i === 0 ? [x.from, x.to] : [x.to]).filter(Boolean).join(" → ")).join(" → "))}</div>` : "";
        const when = [l.departureAt ? fmtDate(l.departureAt) : "", fmt12(l.departureTime)].filter(Boolean).join(", ");
        const arr = fmt12(l.arrivalTime) || "";
        if (l.mode === "stay") return `${head}<div class="leg">${pos ? `<b>${pos}.</b> ` : ""}<b>🌙 Night stay</b> — ${esc(l.to || l.from || "")}${l.service ? ` · ${esc(l.service)}` : ""}
          <div class="muted">${[l.departureAt ? "Check-in " + esc(fmtDate(l.departureAt)) : "", l.arrivalAt ? "Check-out " + esc(fmtDate(l.arrivalAt)) : ""].filter(Boolean).join(" · ") || "Dates not set"} · ${esc(ST[l.status] || l.status)}${l.ref ? " · Ref " + esc(l.ref) : ""}</div>
          ${l.tickets.map((t) => `<div><a href="/api/public/me/${encodeURIComponent(token)}/ticket/${t.id}" target="_blank" rel="noopener">🎫 ${esc(t.name)}</a></div>`).join("")}</div>`;
        return `${head}<div class="leg">${pos ? `<b>${pos}.</b> ` : ""}<b>${TYPE[l.type] || ""}</b> ${esc(MODE[l.mode] || "")} — ${esc(l.from || "?")} → ${esc(l.to || "?")}
          <div class="muted">${esc(when) || "Date not set"}${arr ? " · arrives " + esc(arr) : ""}${l.arrivalAt ? " · returns " + esc(fmtDate(l.arrivalAt)) : ""} · ${esc(ST[l.status] || l.status)}${l.ref ? " · Ref " + esc(l.ref) : ""}</div>
          ${l.tickets.map((t) => `<div><a href="/api/public/me/${encodeURIComponent(token)}/ticket/${t.id}" target="_blank" rel="noopener">🎫 ${esc(t.name)}</a></div>`).join("")}${checkinHtml(l)}</div>`;
      }).join("") : `<div class="muted">Travel not added yet.</div>`;
      const ack = e.travelAck || { state: "none" };
      const ackHtml = e.past || !legsSorted.length || ack.state === "none" ? "" : ack.state === "seen"
        ? `<div class="muted" style="margin-top:8px;">✓ You confirmed this plan on ${esc(fmtDate(ack.at))}</div>`
        : `${ack.state === "changed" ? `<div class="muted" style="margin-top:8px; color:#A6432B;">Your travel plan changed after you confirmed it. Please check it again.</div>` : ""}<button class="save" data-ack="${i}" style="background:#E4F1F1; color:#1C7A80;">✓ Got it — I've seen my travel plan</button>`;
      const pay = e.pay ? `<div class="sec">Payment</div><span class="pill ${e.pay.paid ? "p-paid" : "p-pending"}">${e.pay.paid ? "Paid" : e.pay.paidSoFar > 0 ? "Part paid" : "Payment pending"}</span>${e.pay.paid && e.pay.date ? `<span class="muted">${esc(fmtDate(e.pay.date))}${e.pay.mode ? " · " + esc(e.pay.mode) : ""}</span>` : ""}${e.pay.amount ? `<div class="muted">₹${e.pay.amount.toLocaleString("en-IN")}${!e.pay.paid && e.pay.paidSoFar > 0 ? ` · ₹${e.pay.paidSoFar.toLocaleString("en-IN")} paid so far, ₹${(e.pay.amount - e.pay.paidSoFar).toLocaleString("en-IN")} to come` : ""}</div>` : ""}` : "";
      const respond = !e.past && e.status !== "cancel_requested" ? `
        <div class="btns">
          <button class="act b-acc" data-i="${i}" data-s="accepted" ${e.status === "accepted" ? "disabled" : ""}>✓ Accept</button>
          ${e.status === "accepted" ? "" : `<button class="act b-dec" data-i="${i}" data-s="declined" ${e.status === "declined" ? "disabled" : ""}>✕ Decline</button>`}
        </div>
        ${e.status === "accepted" ? `<div class="muted" style="margin-top:6px;">Need to make a change? Please contact Team Together, Out Loud directly.</div>` : ""}
        <textarea data-note="${i}" placeholder="Note for the organizer (optional) — e.g. running a bit late">${esc(e.note || "")}</textarea>
        <button class="save" data-save="${i}">Save note</button>` : "";
      const STATUS = { waiting: ["p-pending", "Waiting for approval"], approved: ["p-accepted", "Approved"], paid: ["p-paid", "Paid"], "part paid": ["p-accepted", "Part paid"], withheld: ["p-declined", "Withheld — check-in"] };
      const claims = e.status === "declined" ? "" : `<div class="sec">Reimbursements</div>
        ${(e.claims || []).map((c) => `<div class="claim"><div><b>₹${c.amount.toLocaleString("en-IN")}</b> — ${esc(c.what)}<div class="muted">${esc(fmtDate(c.at))}${c.receipts ? " · 📎 slip attached" : " · no slip"}</div></div><span class="pill ${STATUS[c.status][0]}" style="align-self:flex-start;">${STATUS[c.status][1]}${c.status === "part paid" ? " · ₹" + c.paidSoFar.toLocaleString("en-IN") : ""}${c.status === "paid" && c.paidOn ? " · " + esc(fmtDate(c.paidOn)) : ""}</span></div>`).join("")}
        ${openClaim === i ? `<form class="claim-form" data-claim-form="${i}">
          <input type="number" name="amount" inputmode="numeric" placeholder="Amount you spent (₹)" required />
          <input type="text" name="what" maxlength="200" placeholder="What for — e.g. cab to the venue" required />
          <label class="file">📷 Add a photo of the slip<input type="file" name="file" accept="image/*,application/pdf" /></label>
          <div class="muted" data-file-name="${i}" style="margin-top:4px;"></div>
          <div class="btns"><button class="act b-claim" type="submit">Send claim</button><button class="act b-dec" type="button" data-claim-cancel>Cancel</button></div>
        </form>` : `<button class="save" data-claim-open="${i}">🧾 Claim a reimbursement</button>`}`;
      return `<div class="card">
        <div class="when">${esc(fmtDate(e.date))}</div>
        <div class="title">${esc(e.place)}</div>
        <div class="muted">${esc(e.experience)}</div>
        <span class="pill ${pill[0]}">${pill[1]}</span>${e.tentative ? `<span class="pill p-tent">Tentative</span>` : ""}
        <div style="margin-top:6px;">${rows.map((r) => `<div class="row"><div class="ic">${r[0]}</div><div>${esc(r[1])}</div></div>`).join("")}
          ${e.venue || e.city ? `<div class="row"><div class="ic">📍</div><div>${esc(e.venue || e.city)} · <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([e.venue, e.city].filter(Boolean).join(", "))}" target="_blank" rel="noopener">Open in Maps</a></div></div>` : ""}
          ${e.fee != null && !e.past ? `<div class="row"><div class="ic">💰</div><div>Your fee: ${inr(e.fee)} <span class="muted">(paid after the event)</span></div></div>` : ""}</div>
        ${(e.contacts || []).length ? `<div class="sec">On-site contacts</div>${e.contacts.map((c) => { const d = String(c.phone || "").replace(/\D/g, ""); return `<div class="row"><div class="ic">📞</div><div><b>${esc(c.name || c.role)}</b>${c.name ? ` <span class="muted">${esc(c.role)}</span>` : ""}${d ? ` · <a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>` : ""}</div></div>`; }).join("")}` : ""}
        ${(e.lineup || []).length ? `<div class="sec">Playing with you</div><div>${e.lineup.map((x) => esc(x.name) + (x.confirmed ? "" : " <span class='muted'>(not confirmed yet)</span>")).join(", ")}</div>` : ""}
        <div class="sec">Travel</div>${travel}${ackHtml}${pay}${claims}${respond}
        <div class="msg" id="msg${i}"></div></div>`;
    }
    // What we owe you, what's coming, and every payment we've made (part payments shown as such).
    function moneyHtml() {
      const m = data.money || { items: [], history: [], owedNow: 0, upcoming: 0, received: 0 };
      const byId = Object.fromEntries(m.items.map((i) => [i.id, i]));
      const label = (i) => (i.kind === "fee" ? `Fee · ${i.place || "event"}${i.date ? " · " + fmtDate(i.date) : ""}` : `${i.kind === "due" ? "Amount owed" : "Reimbursement"}${i.what ? " · " + i.what : ""}${i.place ? " · " + i.place : ""}`);
      const line = (i) => `<div class="claim"><div><b>${esc(label(i))}</b>${i.paidAmount > 0 ? `<div class="muted">${inr(i.paidAmount)} of ${inr(i.amount)} paid</div>` : ""}</div><b>${inr(i.left)}</b></div>`;
      const owed = m.items.filter((i) => i.due && i.left > 0), later = m.items.filter((i) => !i.due && i.left > 0);
      return `<div class="card"><div class="muted">Owed to you now</div><div class="title" style="color:${m.owedNow ? "#A6432B" : "#1C7A80"};">${inr(m.owedNow)}</div>
          <div class="muted" style="margin-top:6px;">Coming up after events: <b>${inr(m.upcoming)}</b> · Received in all: <b>${inr(m.received)}</b></div></div>
        <div class="card"><div class="sec" style="margin-top:0;">Owed to you now</div>${owed.length ? owed.map(line).join("") : `<div class="muted">Nothing owed right now. 🎉</div>`}
          ${later.length ? `<div class="sec">Coming up — after the events</div>${later.map(line).join("")}` : ""}</div>
        <div class="card"><div class="sec" style="margin-top:0;">Payments you've received</div>${m.history.length ? m.history.map((h) => `<div class="claim" style="display:block;"><div style="display:flex; justify-content:space-between;"><b>${inr(h.amount)}</b><span class="muted">${esc(fmtDate(h.paidOn))}${h.mode ? " · " + esc(h.mode) : ""}</span></div><div class="muted">${h.covers.map((c) => byId[c.expenseId] ? esc(label(byId[c.expenseId])) + (c.amount < byId[c.expenseId].amount ? ` (${inr(c.amount)} of ${inr(byId[c.expenseId].amount)})` : "") : "").filter(Boolean).join("; ")}</div></div>`).join("") : `<div class="muted">No payments yet.</div>`}</div>`;
    }
    function render() {
      const list = tab === "upcoming" ? data.upcoming : data.past;
      const cis = data.checkinsNow || [];
      const locked = (data.ratingsDue || []).length > 0;
      const mr = data.myRatings;
      app.innerHTML = `<div class="hello">Hi ${esc(data.name.split(" ")[0])} 👋</div>
        ${locked ? ratingLockHtml() : ""}${locked ? "" : `
        ${cis.map((c) => `<div class="card" style="border:2px solid #6B4488;"><div class="title" style="font-size:17px;">📸 ${c.state === "upcoming" ? "Check in today" : c.state === "overdue" ? "Check-in overdue" : "Check in now"}</div>
          <div class="muted">${esc(MODE[c.mode] || "Travel")} ${esc(c.from || "")} → ${esc(c.to || "")} · photo of yourself at the station/airport ${c.state === "overdue" ? "was due" : "due"} by <b>${esc(istWhen(c.dueAt))}</b>${c.state === "upcoming" ? " · opens " + esc(istWhen(c.opensAt)) : ""}</div>
          ${c.state === "upcoming" ? "" : `<button class="save" data-ci="${esc(c.legId)}" style="background:#6B4488; color:#fff;">📸 Check in</button>`}</div>`).join("")}
        ${data.hasLogin ? `<div class="card" style="padding:12px 16px;"><div class="muted">You also have a login for the full app${data.username ? ` (username: <b>${esc(data.username)}</b>)` : ""}.</div><a href="/login" style="display:inline-block; margin-top:8px; padding:10px 16px; border-radius:10px; background:#C7401E; color:#fff; font-weight:700; text-decoration:none;">Log in to the app</a></div>` : ""}
        <div class="tabs"><button class="tab ${tab === "upcoming" ? "on" : ""}" data-tab="upcoming">Upcoming (${data.upcoming.length})</button><button class="tab ${tab === "past" ? "on" : ""}" data-tab="past">Past (${data.past.length})</button><button class="tab ${tab === "money" ? "on" : ""}" data-tab="money">Money</button></div>
        ${tab === "money" ? (mr && mr.shown ? `<div class="card"><div class="muted">How the team rates you (anonymous, ${mr.count} ratings)</div><div class="title" style="font-size:18px;">${starsRo(mr.overall)}</div>${RK.map(([k, l]) => `<div class="muted">${l}: ${starsRo(mr[k])}</div>`).join("")}</div>` : "") + moneyHtml() : list.length ? list.map(eventCard).join("") : `<div class="card"><div class="muted">${tab === "upcoming" ? "No upcoming events yet — we'll add them here as soon as you're booked." : "Nothing here yet."}</div></div>`}`}`;
      if (locked) wireRatingLock();
      app.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => { tab = b.dataset.tab; openClaim = null; render(); }));
      app.querySelectorAll("[data-ci]").forEach((b) => b.addEventListener("click", () => checkinUpload(b.dataset.ci)));
      app.querySelectorAll("[data-claim-open]").forEach((b) => b.addEventListener("click", () => { openClaim = +b.dataset.claimOpen; render(); app.querySelector('[data-claim-form] input[name="amount"]')?.focus(); }));
      app.querySelectorAll("[data-claim-cancel]").forEach((b) => b.addEventListener("click", () => { openClaim = null; render(); }));
      app.querySelectorAll('[data-claim-form] input[type="file"]').forEach((f) => f.addEventListener("change", () => {
        const i = f.closest("[data-claim-form]").dataset.claimForm;
        app.querySelector(`[data-file-name="${i}"]`).textContent = f.files[0] ? "📎 " + f.files[0].name : "";
      }));
      app.querySelectorAll("[data-claim-form]").forEach((form) => form.addEventListener("submit", async (ev) => {
        ev.preventDefault();
        const i = +form.dataset.claimForm, list = tab === "upcoming" ? data.upcoming : data.past, e = list[i];
        const msg = document.getElementById("msg" + i), btn = form.querySelector('button[type="submit"]');
        const fd = new FormData(form); fd.append("confirmToken", e.confirmToken);
        if (fd.get("file") && !fd.get("file").size) fd.delete("file");
        btn.disabled = true; msg.textContent = "Sending…";
        try {
          const r = await fetch(`/api/public/me/${encodeURIComponent(token)}/claims`, { method: "POST", body: fd });
          const j = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(j.error || "Couldn't send it — try again.");
          const fresh = await (await fetch(`/api/public/me/${encodeURIComponent(token)}`)).json();
          data = fresh; openClaim = null; render();
          document.getElementById("msg" + i).textContent = "Sent ✓ — Team TOL will check it and let you know.";
        } catch (err) { btn.disabled = false; msg.textContent = err.message; }
      }));
      app.querySelectorAll("button.act").forEach((b) => b.addEventListener("click", () => respond(+b.dataset.i, b.dataset.s)));
      app.querySelectorAll("[data-save]").forEach((b) => b.addEventListener("click", () => saveNote(+b.dataset.save)));
      app.querySelectorAll("[data-ack]").forEach((b) => b.addEventListener("click", async () => {
        const e = data.upcoming[+b.dataset.ack]; b.disabled = true;
        try { const r = await call(`/api/public/me/${encodeURIComponent(token)}/travel-ack`, { confirmToken: e.confirmToken }); e.travelAck = r.ack; render(); }
        catch (err) { b.disabled = false; document.getElementById("msg" + b.dataset.ack).textContent = err.message; }
      }));
    }
    async function call(path, body) {
      const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || "Something went wrong");
      return j;
    }
    async function respond(i, status) {
      const e = data.upcoming[i], msg = document.getElementById("msg" + i), note = (app.querySelector(`[data-note="${i}"]`) || {}).value;
      msg.textContent = "Saving…";
      try {
        await call(`/api/public/assignment/${encodeURIComponent(e.confirmToken)}/respond`, { status, note: (note || "").trim() });
        e.status = status; e.note = (note || "").trim(); render();
        document.getElementById("msg" + i).textContent = status === "accepted" ? "Thanks — see you there! 🎉" : "Got it — thanks for letting us know.";
      } catch (err) { msg.textContent = err.message; }
    }
    async function saveNote(i) {
      const e = data.upcoming[i], msg = document.getElementById("msg" + i), note = app.querySelector(`[data-note="${i}"]`).value.trim();
      msg.textContent = "Saving…";
      try { await call(`/api/public/assignment/${encodeURIComponent(e.confirmToken)}/note`, { note }); e.note = note; msg.textContent = "Note saved."; }
      catch (err) { msg.textContent = err.message; }
    }
    (async () => {
      try {
        const r = await fetch(`/api/public/me/${encodeURIComponent(token)}`);
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || "This link isn't valid.");
        data = j; render();
      } catch (err) { app.innerHTML = `<div class="error">${esc(err.message)}</div>`; }
    })();
  </script>
</body>
</html>
